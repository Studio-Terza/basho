[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
derive_more.workspace = true
newtype = { git = "https://github.com/Studio-Terza/meta-dev", tag = "v0.2.0" }
console-ports = { git = "https://github.com/Studio-Terza/meta-dev", tag = "v0.2.0" }
file-ports = { git = "https://github.com/Studio-Terza/meta-dev", tag = "v0.2.0" }
basho_lints = { path = "../tools/basho_lints" }
guide = { path = "../crates/guide" }
day_print = { path = "../tools/day_print" }
meta-xtask = { git = "https://github.com/Cinglein/meta-dev", rev = "07466e5815cb672b9423c68b77a7b326301e7c58" }
strum = { version = "0.28", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
style_lints = { path = "../tools/style_lints" }
sim_ports = { path = "../tools/sim_ports" }
sim_suite = { path = "../tools/sim_suite" }
testflight_ports = { path = "../tools/testflight_ports" }
osm_items = { path = "../tools/osm_items" }
tile_draft = { path = "../tools/tile_draft" }
tile_shapes = { path = "../tools/tile_shapes" }
thiserror = "2"
toml = "0.9"

[dev-dependencies]
file-ports = { git = "https://github.com/Studio-Terza/meta-dev", tag = "v0.2.0" }
tempfile = "3"
wiki = { path = "../crates/wiki" }
laws = { git = "https://github.com/Studio-Terza/meta-dev", tag = "v0.2.0" }

[lints]
workspace = true
