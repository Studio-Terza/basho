[workspace]
resolver = "3"
members = ["crates/*", "xtask", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Studio-Terza/basho"

[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
derive_more = { version = "2.1.1", features = ["as_ref", "debug", "deref", "from", "into", "into_iterator"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[patch.crates-io]
dioxus-desktop = { path = "vendor/dioxus-desktop" }

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1
