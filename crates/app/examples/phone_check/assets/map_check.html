<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; height: 100%; }
.map-slot, .map-canvas { position: absolute; inset: 0; }
</style>
</head>
<body>
<div class="map-slot"></div>
<script type="module">
const line = [[141.05, 38.36], [141.075, 38.38]];
const scene = {
  bounds: line,
  route: { type: "FeatureCollection", features: [{ type: "Feature", properties: { travel: "walk", state: "current" }, geometry: { type: "LineString", coordinates: line } }] },
  marks: { type: "FeatureCollection", features: [{ type: "Feature", properties: { mark: "goal", strength: "strong", label: "Goal" }, geometry: { type: "Point", coordinates: line[1] } }] },
  walker: { type: "FeatureCollection", features: [{ type: "Feature", properties: { part: "you", mark: "you" }, geometry: { type: "Point", coordinates: line[0] } }] },
};
const inbox = [
  { library: "/assets/maplibre-gl.js", worker: "/assets/maplibre-gl-worker.js", sheet: "/assets/maplibre-gl.css", style: "/assets/map_style.json", tiles: "/tiles" },
  scene,
];
window.bashoHeard = [];
const dioxus = {
  recv: async () => (inbox.length ? inbox.shift() : new Promise(() => {})),
  send: (event) => window.bashoHeard.push(event),
};
const engine = await fetch("/assets/map_engine.js").then((reply) => reply.text());
const Running = Object.getPrototypeOf(async () => {}).constructor;
new Running("dioxus", engine)(dioxus);
</script>
</body>
</html>
