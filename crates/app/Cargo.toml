[package]
name = "basho"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
plain_text = { path = "../plain_text" }
strum = { version = "0.28", features = ["derive"] }
derive_more.workspace = true
newtype = { git = "https://github.com/Studio-Terza/meta-dev", tag = "v0.2.0" }
dioxus = "0.7.10"
guide = { path = "../guide" }
manganis = "0.7.10"
wiki = { path = "../wiki" }
layout = { path = "../layout" }
map_plan = { path = "../map_plan" }
menu = { path = "../menu" }
report = { path = "../report" }
storage_ports = { path = "../storage_ports" }
tiles = { path = "../tiles" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
laws = { git = "https://github.com/Studio-Terza/meta-dev", tag = "v0.2.0" }
dioxus-ssr = "0.7.10"
rayon = "1"
serde_json = "1"
sha1_smol = { version = "1", features = ["std"] }
storage_fake = { path = "../storage_fake" }
toml = "0.9"
tokio = { version = "1", features = ["rt", "time"] }
tungstenite = "0.29"

[target.'cfg(target_os = "ios")'.dependencies]
dioxus = { version = "0.7.10", features = ["mobile"] }
objc2 = "0.6"
objc2-core-location = { version = "0.3", features = ["CLHeading", "CLLocation", "CLLocationManager"] }

[target.'cfg(target_os = "macos")'.dependencies]
dioxus = { version = "0.7.10", features = ["desktop"] }

[lints]
workspace = true
